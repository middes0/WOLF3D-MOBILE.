<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#09090d">
<title>Wolf3D Mobile</title>
<style>
:root{color-scheme:dark;--bg:#09090d;--panel:#171720;--accent:#9d5cff;--line:#353544}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:#fff;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}
body{display:flex;flex-direction:column;min-height:100dvh}
header{height:48px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#101017;border-bottom:1px solid var(--line);font-weight:800;letter-spacing:.08em}
header small{font-size:10px;color:#aaa;letter-spacing:.16em}
#stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#000}
#jsdos{display:block;width:100%;height:100%;max-height:100%;object-fit:contain;image-rendering:pixelated}
#loading{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:#09090d;color:#d8c3ff;z-index:3;gap:10px}
#loading strong{font-size:20px;letter-spacing:.1em}
#loading span{font-size:12px;color:#aaa}
#controls{flex:none;min-height:148px;padding:10px 14px max(12px,env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;gap:16px;background:#101017;border-top:1px solid var(--line)}
.pad{display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:42px 42px;gap:5px}
.control{border:1px solid #454052;border-radius:12px;background:linear-gradient(160deg,#272333,#17151f);color:#fff;font-size:18px;font-weight:700;touch-action:none;user-select:none;display:grid;place-items:center;min-width:0}
.control:active,.control.down{background:#5e32a0;border-color:#bd92ff}
.up{grid-column:2;grid-row:1}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}
.actions{display:grid;grid-template-columns:repeat(2,minmax(62px,1fr));gap:8px;flex:1;max-width:210px}
.actions .control{height:58px;font-size:12px;letter-spacing:.04em}
.fire{background:linear-gradient(150deg,#642e9e,#351b58);border-color:#8d59cb}
footer{font-size:10px;color:#777;text-align:center;padding:0 8px 5px;background:#101017}
@media(min-width:700px){#controls{justify-content:center;gap:40px}.pad{transform:scale(1.1)}}
@media(max-height:430px){header{height:34px}#controls{min-height:92px;padding:5px 12px} .pad{grid-template-columns:40px 40px 40px;grid-template-rows:32px 32px}.actions .control{height:44px}footer{display:none}}
</style>
</head>
<body>
<header><span>WOLF3D <small>MOBILE</small></span><small>SHAREWARE EDITION</small></header>
<main id="stage">
  <div id="loading"><strong>WOLFENSTEIN 3D</strong><span>Carregando o jogo…</span></div>
  <canvas id="jsdos" width="640" height="400" aria-label="Jogo Wolfenstein 3D"></canvas>
</main>
<section id="controls" aria-label="Controles de toque">
  <div class="pad">
    <button class="control up" data-key="ArrowUp" aria-label="Avançar">▲</button>
    <button class="control left" data-key="ArrowLeft" aria-label="Virar à esquerda">◀</button>
    <button class="control down" data-key="ArrowDown" aria-label="Recuar">▼</button>
    <button class="control right" data-key="ArrowRight" aria-label="Virar à direita">▶</button>
  </div>
  <div class="actions">
    <button class="control fire" data-key="Control" aria-label="Atirar">ATIRAR</button>
    <button class="control" data-key=" " aria-label="Abrir porta">ABRIR<br>PORTA</button>
    <button class="control" data-key="Escape" aria-label="Pausar">PAUSAR</button>
    <button class="control" id="fullscreen">TELA<br>CHEIA</button>
  </div>
</section>
<footer>Use os botões de toque. Melhor em modo paisagem.</footer>
<script src="https://js-dos.com/6.22/current/js-dos.js"></script>
<script>
(function(){
 const base='https://js-dos.com/6.22/current/';
 const game='https://raw.githubusercontent.com/menene/wolf3d-jsdos/main/';
 const canvas=document.getElementById('jsdos');
 const loading=document.getElementById('loading');
 let ci=null;
 const keyCodes={'ArrowUp':265,'ArrowDown':264,'ArrowLeft':263,'ArrowRight':262,' ':32,'Control':341,'Escape':256};
 document.querySelectorAll('[data-key]').forEach(btn=>{
   const key=btn.dataset.key;
   let pressed=false;
   const startPress=e=>{
     e.preventDefault();
     if(pressed)return;
     pressed=true;
     btn.classList.add('down');
     try{btn.setPointerCapture(e.pointerId)}catch(_){}
     if(ci)ci.sendKeyEvent(keyCodes[key],true);
   };
   const stopPress=e=>{
     if(e)e.preventDefault();
     if(!pressed)return;
     pressed=false;
     btn.classList.remove('down');
     if(ci)ci.sendKeyEvent(keyCodes[key],false);
   };
   btn.addEventListener('pointerdown',startPress);
   ['pointerup','pointercancel','lostpointercapture','pointerleave'].forEach(t=>btn.addEventListener(t,stopPress));
   btn.addEventListener('contextmenu',e=>e.preventDefault());
 });
 document.getElementById('fullscreen').addEventListener('click',()=>{
   const target=document.documentElement;
   if(!document.fullscreenElement && target.requestFullscreen) target.requestFullscreen().catch(()=>{});
   else if(document.exitFullscreen) document.exitFullscreen().catch(()=>{});
 });
 if(typeof Dos!=='function'){loading.innerHTML='<strong>Falha ao carregar o emulador</strong><span>O navegador não conseguiu baixar o motor do jogo. Atualize a página em alguns segundos.</span>';return}
 Dos(canvas,{wdosboxUrl:base+'wdosbox.js',onerror:(message)=>{loading.innerHTML='<strong>Erro no emulador</strong><span>'+String(message||'Falha na inicialização')+'</span>'}}).ready((fs,main)=>{
   fs.extract(game+'wolf3d.zip').then(()=>{
     loading.style.display='none';
     Promise.resolve(main(['-c','WOLF3D.EXE'])).then(instance=>{ci=instance;});
   }).catch(()=>{loading.innerHTML='<strong>Falha ao carregar</strong><span>Não foi possível carregar os arquivos do jogo.</span>'});
 }).catch(()=>{loading.innerHTML='<strong>Falha ao iniciar</strong><span>Recarregue a página e tente novamente.</span>'});
})();
</script>
</body>
</html>
